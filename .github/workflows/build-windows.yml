name: Build Windows timeout analyzer

on:
  push:
    branches: [main]
    paths:
      - tools/run/timeout_analyzer_gui.py
      - .github/workflows/build-windows.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Smoke test analyzer
        run: python tools/run/timeout_analyzer_gui.py --smoke-test

      - name: Build standalone Windows executable
        run: >
          pyinstaller
          --noconfirm --clean --onefile --windowed
          --name OrbitalsTimeoutAnalyzer
          --distpath build/exe
          --workpath build/pyi
          --specpath build
          tools/run/timeout_analyzer_gui.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "build/exe/OrbitalsTimeoutAnalyzer.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          $size = (Get-Item $exe).Length
          "Built $exe ($([math]::Round($size/1MB,2)) MiB)"
          if ($size -lt 1MB) { throw "Executable suspiciously small ($size bytes)" }

      - name: Upload executable as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrbitalsTimeoutAnalyzer-windows
          path: build/exe/OrbitalsTimeoutAnalyzer.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish executable to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo   = $env:GITHUB_REPOSITORY
          $tag    = 'timeout-analyzer'
          $asset  = 'build/exe/OrbitalsTimeoutAnalyzer.exe'

          # Create the release if it doesn't exist yet (idempotent).
          gh release view $tag --repo $repo 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --target $env:GITHUB_SHA `
              --title 'Orbitals Timeout Analyzer for Windows' `
              --notes 'Standalone Windows GUI. Download OrbitalsTimeoutAnalyzer.exe, open it, and select orbital.log. Logs are analyzed locally and are not uploaded.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the timeout-analyzer release.' }
          }

          # Always (re)upload the fresh build, overwriting any previous asset.
          gh release upload $tag $asset --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload OrbitalsTimeoutAnalyzer.exe to the release.' }
