name: Build Orbitals TLS Crash Probe (Windows)
on:
  push:
    branches: [main, tls-crash-probe]
    paths:
      - 'crash-probe/**'
      - '.github/workflows/build-tls-crash-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish standalone executable
        run: dotnet publish crash-probe/OrbitalsTlsCrashProbe/OrbitalsTlsCrashProbe.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitalsTlsCrashProbe-win-x64
          path: artifacts/OrbitalsTlsCrashProbe.exe
          if-no-files-found: error
          retention-days: 30