name: Build Crash B Writer Hunter Windows
on:
  push:
    paths:
      - "tools/crash_b_writer_hunter_v1/**"
      - ".github/workflows/build-crash-b-writer-hunter.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install pyinstaller capstone
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Orbitals_CrashB_QWORD_Hunter tools/crash_b_writer_hunter_v1/orbitals_crash_b_writer_hunter.py
      - uses: actions/upload-artifact@v4
        with:
          name: Orbitals_CrashB_QWORD_Hunter_Windows
          path: dist/Orbitals_CrashB_QWORD_Hunter.exe
          if-no-files-found: error
          retention-days: 30
