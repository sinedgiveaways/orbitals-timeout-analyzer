name: Build Crash B Pointer Provenance Windows
on:
  push:
    paths:
      - "tools/crash_b_pointer_provenance_v2/**"
      - ".github/workflows/build-crash-b-pointer-provenance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pyinstaller capstone
      - name: Build pointer provenance GUI
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Orbitals_CrashB_Pointer_Provenance tools/crash_b_pointer_provenance_v2/orbitals_crash_b_pointer_provenance_v2.py
      - name: Build fallback disassembly report GUI
        run: pyinstaller --noconfirm --onefile --windowed --name Orbitals_CrashB_Report_Generator --distpath dist/fallback --workpath build/fallback --specpath build/fallback tools/crash_b_pointer_provenance_v2/orbitals_crash_b_fallback_dump.py
      - uses: actions/upload-artifact@v4
        with:
          name: Orbitals_CrashB_Analysis_Tools_Windows
          path: |
            dist/Orbitals_CrashB_Pointer_Provenance.exe
            dist/fallback/Orbitals_CrashB_Report_Generator.exe
          if-no-files-found: error
          retention-days: 30
